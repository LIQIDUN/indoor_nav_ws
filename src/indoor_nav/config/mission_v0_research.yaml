schema_version: 1
mission_id: acoustic_relative_v0_research_001
navigation: {vehicle: ArduCopter, source: fc_ekf_gps, require_upstream_health: false}
reference: {origin: pose_at_mission_start, heading: yaw_at_mission_start, axes: forward_right_up}
start_policy:
  require_operator_start: true
  require_manual_takeoff: true
  require_stable_hover: false
  require_guided_mode: true
  auto_arm: false
  auto_takeoff: false
  auto_land: false
control: {dry_run_default: true, setpoint_rate_hz: 10.0, yaw_policy: hold_initial_yaw, exit_action: manual_takeover}
motion: {speed_xy_mps: 0.20, max_speed_xy_mps: 0.30, speed_enforcement: record_fcu_limits, overspeed_action: warn}
arrival: {xy_tolerance_m: 0.12, z_tolerance_m: 0.08, stable_time_s: 1.5, max_waypoint_time_s: 15.0, timeout_action: warn_and_wait}
msg_timeout: {pose_timeout: 0.5, velocity_timeout: 0.5, state_timeout: 3.0, command_timeout: 0.5}
safety:
  max_offset_xy_m: 0.80
  max_offset_z_m: 0.20
  gps_timeout_s: 3.0
  ekf_timeout_s: 3.0
  jump_distance_m: 0.35
  overspeed_duration_s: 0.8
  max_speed_z_mps: 0.20
  hover_time_s: 2.0
  hover_speed_mps: 0.08
  hover_radius_m: 0.08
  hover_yaw_rad: 0.15
  max_tilt_rad: 0.35
  initial_hold_s: 2.0
  clock_tolerance_s: 0.5
  cycle_timeout_s: 0.5
  freeze_window_s: 1.5
  freeze_distance_m: 0.005
  freeze_speed_mps: 0.12
  upstream_timeout_s: 1.0
  watchdog_timeout_s: 0.6
  abort_on_mode_change: true
  abort_on_localization_loss: true
  prevent_auto_resume: true
waypoints:
  - {id: initial_hold, x: 0.0, y: 0.0, z: 0.0, hold_s: 3.0}
  - {id: forward, x: 0.3, y: 0.0, z: 0.0, hold_s: 4.0}
  - {id: left, x: 0.3, y: -0.3, z: 0.0, hold_s: 4.0}
  - {id: backward, x: 0.0, y: -0.3, z: 0.0, hold_s: 4.0}
  - {id: return, x: 0.0, y: 0.0, z: 0.0, hold_s: 5.0}
finish: {action: hold_and_wait_pilot}
