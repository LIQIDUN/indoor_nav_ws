# Site data are EXAMPLES, not surveyed anchors. DO NOT enable for flight unchanged.
world:
  frame_id: world_lab
  anchor_map_verified: false       # operator must survey/persist Anchor Map, then set true
  nav_xy_at_world_origin: [0.0, 0.0]  # fixed EKF local XY at physical world_lab origin
  nav_z_offset_m: 0.0              # range-derived Z -> nav Z offset; do not depend on FC local pose
  ground_reference:
    enabled: true
    tag_id: 1                      # replace with REAL tag ID
    physical_xy: [0.30, 0.30]     # surveyed physical reference point, metres
    calibration_time_s: 8.0
    min_samples: 25
    max_allowed_offset_m: 0.30
    max_std_m: 0.10
    topic: /nlink_linktrack_anchorframe0
  yaw_alignment:
    method: fixed_start_pose
    require_nose_along_world_x: true
uwb:
  aircraft_tag_id: 0              # replace with REAL tag ID
  body_to_tag_flu_m: [0.0, 0.0, 0.0]  # MEASURE body-origin -> antenna, body FLU metres
  aircraft_topic: /nlink_linktrack_nodeframe2
  timeout_s: 0.20
  max_jump_m: 0.30
  max_implied_speed_mps: 1.50
  noise_floor_m: 0.10
  max_eop_xy_m: 0.50
height:
  # IMPORTANT: must verify actual MAVROS Range topic using `rostopic list`.
  range_topic: /mavros/rangefinder/rangefinder
  min_valid_m: 0.10
  max_valid_m: 2.00
  timeout_s: 0.20
  range_to_body_z_m: 0.0          # surveyed sensor-to-body reference offset
fc_pose_timeout_s: 0.40          # diagnostic only, not initialization gate
imu_attitude_topic: /mavros/imu/data
imu_attitude_timeout_s: 0.40
freeze:
  movement_epsilon_m: 0.015
output:
  odom_rate_hz: 30.0
  min_xy_sigma_m: 0.10      # conservative EKF measurement variance floor
  external_nav_enabled: false     # NEVER forward blindly in real aircraft
